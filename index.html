<!doctype html>
<html lang="en" data-theme="minimal" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Todoi</title>
    <link rel="icon" type="image/png" href="/favicon/minimal-light.png" data-td-favicon />
    <script>
      // Pre-paint: apply the stored theme, mode and favicon before any CSS resolves, so there is no flash.
      // The appearance store (src/client/design/core/appearance.ts) owns these attributes once it loads.
      (function () {
        try {
          var raw = localStorage.getItem("td-appearance");
          var s = raw ? JSON.parse(raw).state : null;
          var root = document.documentElement;
          if (s && s.theme === "standard") s.theme = "rounded";
          if (s && (s.theme === "rounded" || s.theme === "minimal")) root.setAttribute("data-theme", s.theme);
          if (s && (s.mode === "dark" || s.mode === "light")) root.setAttribute("data-mode", s.mode);
          var icon = document.querySelector("link[data-td-favicon]");
          if (icon) icon.setAttribute("href", "/favicon/" + root.getAttribute("data-theme") + "-" + root.getAttribute("data-mode") + ".png");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
