<!doctype html>
<html lang="en" data-theme="minimal" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>todoi</title>
    <link rel="icon" type="image/png" href="/favicon/minimal-light.png" data-td-favicon />
    <!-- Home-screen install (public/manifest.webmanifest; icons rendered from the Minimal light favicon). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="todoi" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)" />
    <script>
      // Zod parses without compiling (`Function(…)`), which the Content-Security-Policy (src/server/csp.ts)
      // doesn't allow; set here because a module-level z.config() can run after the first parse.
      globalThis.__zod_globalConfig = { jitless: true };
      // Pre-paint: apply the stored theme, mode and favicon before any CSS resolves, so there is no flash.
      // The appearance store (src/client/design/core/appearance.ts) owns these attributes once it loads.
      (function () {
        try {
          var raw = localStorage.getItem("td-appearance");
          var s = raw ? JSON.parse(raw).state : null;
          var root = document.documentElement;
          if (s && s.theme === "standard") s.theme = "rounded";
          if (s && (s.theme === "rounded" || s.theme === "minimal")) root.setAttribute("data-theme", s.theme);
          if (s && (s.mode === "dark" || s.mode === "light")) root.setAttribute("data-mode", s.mode);
          var icon = document.querySelector("link[data-td-favicon]");
          if (icon) icon.setAttribute("href", "/favicon/" + root.getAttribute("data-theme") + "-" + root.getAttribute("data-mode") + ".png");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
