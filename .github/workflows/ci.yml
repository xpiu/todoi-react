name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, theme parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  storybook:
    name: Storybook components × themes, interactions, accessibility
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright-chromium
      - run: npm run build-storybook
      - run: npm run test:storybook
      - run: npm run design-sync:check

  browser:
    name: Screens × scopes, axe, reduced motion
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: todoi
          POSTGRES_PASSWORD: todoi
          POSTGRES_DB: todoi_react
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U todoi" --health-interval 5s --health-timeout 5s --health-retries 10
    # `.env.example` (copied below) holds the dev defaults; only what differs on the runner is set here.
    env:
      DATABASE_URL: postgres://todoi:todoi@localhost:5432/todoi_react
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run test:integration
      - uses: ./.github/actions/playwright-chromium
      # Visual baselines are recorded per platform; until linux baselines are committed the snapshots
      # are skipped here and only the scope, axe and motion assertions gate the build.
      - run: npm run test:e2e -- --ignore-snapshots
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            .tmp/playwright-report
            .tmp/test-results
            .tmp/shots
          retention-days: 7

  # Staging deploys only commits that passed every gate above: this job fast-forwards the `staging` branch to
  # the commit, and Dokploy (GitHub provider, branch `staging`, Autodeploy on push) builds that branch. Pushes
  # to main alone never reach staging.todoi.com. The Dokploy panel stays private (SSH tunnel only), so no
  # Dokploy secret lives in GitHub. A run for an older commit never moves staging back.
  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, storybook, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          if git rev-parse -q --verify origin/staging >/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" origin/staging; then
            echo "staging is already at $GITHUB_SHA or a newer commit"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/staging"
          echo "::notice::staging → ${GITHUB_SHA::7}; Dokploy builds it now (Settings › About shows the commit once it is live)"
